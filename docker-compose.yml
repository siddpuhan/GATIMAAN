services:
  postgres:
    image: postgres:16-alpine
    container_name: gatimaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatimaan
      POSTGRES_PASSWORD: gatimaan
      POSTGRES_DB: gatimaan
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gatimaan -d gatimaan']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
